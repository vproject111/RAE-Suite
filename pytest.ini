[pytest]
testpaths = tests core
pythonpath = .
addopts = --import-mode=importlib
norecursedirs = packages/rae-agentic-memory packages/rae-hive/work_dir packages/rae-phoenix packages/rae-lab venv .openclaw workspace build htmlcov
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
