services:
  rae-am-postgres:
    image: ankane/pgvector:latest
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=rae
      - POSTGRES_USER=rae
      - POSTGRES_PASSWORD=rae_password
    volumes:
      - ${RAE_DATA_DIR:-../RAE-agentic-memory/data}/postgres:/var/lib/postgresql/data
    networks:
      - rae-internal

  rae-am-redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ${RAE_DATA_DIR:-../RAE-agentic-memory/data}/redis:/data
    networks:
      - rae-internal

  rae-am-qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ${RAE_DATA_DIR:-../RAE-agentic-memory/data}/qdrant:/qdrant/storage
    networks:
      - rae-internal

  rae-memory:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-memory:5.3.2
    restart: always
    command: ["/usr/local/bin/rae-memory"]
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RAE_PORT=8000
      - RAE_LIVE_DB=1
      - RAE_API_URL=http://localhost:8000
      - POSTGRES_HOST=rae-am-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=rae
      - POSTGRES_USER=rae
      - POSTGRES_PASSWORD=rae_password
      - REDIS_HOST=rae-am-redis
      - QDRANT_HOST=rae-am-qdrant
      - QDRANT_PORT=6333
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
    depends_on:
      - rae-am-postgres
      - rae-am-redis
      - rae-am-qdrant
    networks:
      - rae-internal

  rae-am-celery-worker:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-memory:5.3.2
    restart: always
    command: ["/usr/local/bin/rae-crl"]
    environment:
      - PORT=8503
      - RAE_API_URL=http://rae-memory:8000
      - POSTGRES_HOST=rae-am-postgres
      - POSTGRES_DB=rae
      - POSTGRES_USER=rae
      - POSTGRES_PASSWORD=rae_password
      - REDIS_HOST=rae-am-redis
      - QDRANT_HOST=rae-am-qdrant
    depends_on:
      - rae-am-postgres
      - rae-am-redis
      - rae-memory
    networks:
      - rae-internal

  rae-am-celery-beat:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-memory:5.3.2
    restart: always
    command: ["/usr/local/bin/rae-crl"]
    environment:
      - PORT=8504
      - RAE_API_URL=http://rae-memory:8000
      - POSTGRES_HOST=rae-am-postgres
      - POSTGRES_DB=rae
      - POSTGRES_USER=rae
      - POSTGRES_PASSWORD=rae_password
    depends_on:
      - rae-am-postgres
      - rae-am-redis
      - rae-memory
    networks:
      - rae-internal

  rae-suite:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-suite:5.3.2
    restart: always
    command: ["/usr/local/bin/rae-suite"]
    ports:
      - "8009:8009"
    environment:
      - PORT=8009
      - RAE_API_URL=http://rae-memory:8000
      - RAE_QUALITY_URL=http://rae-quality:8000
      - RAE_LAB_URL=http://rae-lab:8011
      - RAE_PLANNING_FLOW=${RAE_PLANNING_FLOW:-tot_mcts}
      - RAE_CODING_FLOW=${RAE_CODING_FLOW:-standard}
    depends_on:
      - rae-memory
    networks:
      - rae-internal

  rae-lab:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-lab:5.3.2
    restart: always
    command: ["/usr/local/bin/rae-lab"]
    ports:
      - "8011:8011"
    environment:
      - PORT=8011
      - RAE_API_URL=http://rae-memory:8000
    depends_on:
      - rae-suite
    networks:
      - rae-internal

  rae-quality:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-quality:5.3.2
    restart: always
    command: ["/usr/local/bin/rae-quality"]
    ports:
      - "8010:8000"
    environment:
      - PORT=8000
      - RAE_API_URL=http://rae-memory:8000
      - RAE_CLOUD_ROOT=/cloud
    volumes:
      - /mnt/extra_storage/dreamsoft_factory:/projects:ro
      - ..:/cloud:ro
    depends_on:
      - rae-suite
    networks:
      - rae-internal

  rae-phoenix:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-phoenix:5.3.2
    restart: always
    command: ["/usr/local/bin/rae-phoenix"]
    ports:
      - "8012:8000"
    environment:
      - PORT=8000
      - RAE_API_URL=http://rae-memory:8000
      - QUALITY_API_URL=http://rae-quality:8000
    volumes:
      - /mnt/extra_storage/dreamsoft_factory:/projects
    depends_on:
      - rae-suite
    networks:
      - rae-internal

  rae-hive:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-hive:5.3.2
    restart: always
    command: ["/usr/local/bin/rae-hive"]
    ports:
      - "8013:8000"
    environment:
      - PORT=8000
      - RAE_API_URL=http://rae-memory:8000
    volumes:
      - /mnt/extra_storage/dreamsoft_factory:/projects
    depends_on:
      - rae-suite
    networks:
      - rae-internal

  rae-supervisor:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-supervisor:5.3.2
    restart: always
    ports:
      - "8005:8005"
    command: ["/usr/local/bin/rae-mcp"]
    environment:
      - PORT=8005
      - RAE_API_URL=http://rae-memory:8000
      - RAE_MCP_SSE=1
      - RAE_MCP_PORT=8005
    depends_on:
      - rae-memory
    networks:
      - rae-internal

  rae-portal:
    image: harbor.cloud.printworks.pl/dreamsoft/rae-portal:5.3.2
    container_name: rae-portal
    restart: unless-stopped
    command: ["/usr/local/bin/rae-portal"]
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - RAE_API_URL=http://rae-memory:8000
    depends_on:
      - rae-memory
    networks:
      - rae-internal

  sonarqube:
    image: sonarqube:community
    restart: always
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=rae
      - SONAR_JDBC_PASSWORD=rae_password
      - SONAR_JDBC_URL=jdbc:postgresql://rae-am-postgres:5432/sonar
    depends_on:
      - rae-am-postgres
    networks:
      - rae-internal
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  rae-internal:
    name: rae-internal
    driver: bridge
